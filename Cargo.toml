[package]
name = "uptime_monitor"
version = "0.1.0"
edition = "2021"

[features]
default = []
mongodb = ["dep:mongodb"]
mysql = ["dep:mysql_async"]
kafka = ["dep:rdkafka"]
rabbitmq = ["dep:lapin"]
redis = ["dep:redis"]
postgres = ["dep:tokio-postgres"]
# Convenience feature to enable all DB checks
full = ["mongodb", "mysql", "kafka", "rabbitmq", "redis", "postgres"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "process"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls", "socks", "gzip", "brotli", "deflate"] }
base64 = "0.23"
http = "1.5"
actix-web = "4.18"
toml = "0.9"
log = "0.4.35"
env_logger = "0.11.11"
native-tls = "0.2"
openssl = { version = "0.10", features = ["vendored"] }
prometheus = { version = "0.14", features = ["process"] }
chrono = { version = "0.4", features = ["serde"] }
serde_json = "1.0"
jsonpath_lib = "0.3"
regex = "1.13"
uuid = { version = "1.29", features = ["v4"] }
urlencoding = "2.1"

# Protocol coverage / domain expiry
hickory-resolver = "0.26"
tokio-tungstenite = { version = "0.30", features = ["native-tls"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
psl = "2.1"

# Optional DB/service dependencies
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4"], optional = true }
redis = { version = "1.8", features = ["tokio-comp"], optional = true }
lapin = { version = "4.12", optional = true }
rdkafka = { version = "0.39", features = ["cmake-build"], optional = true }
mysql_async = { version = "0.37", optional = true }
mongodb = { version = "3.10", optional = true }

[dev-dependencies]
tempfile = "3.27"
wiremock = "0.6"
h2 = "0.4"
bytes = "1.12"
